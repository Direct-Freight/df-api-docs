delete:
  description: >
    Logs out the session for the given `end-user-token`. The account is not
    affected.

    The token stops working; call `POST /end_user_authentications` to log in
    again.

    To permanently delete the account, use `DELETE /users`.
  parameters:
    - in: header
      name: end-user-token
      required: true
      type: string
  responses:
    '204':
      description: Logged out. No content is returned.
  summary: Logout
  tags:
    - end_user_authentications
get:
  description: >-
    Get current authentication level for the user. API tokens granted the
    view_all_end_user_authentications access can instead look up any Direct
    Freight user by passing user_id or email, without an end-user-token. If both
    are sent, user_id is used. Tokens without that access ignore these
    parameters.
  parameters:
    - in: header
      name: end-user-token
      required: false
      type: string
    - description: >-
        Direct Freight user id to look up. Requires an api-token with
        view_all_end_user_authentications access. Takes precedence over email
        and over the end-user-token.
      in: query
      name: user_id
      required: false
      type: integer
    - description: >-
        Email of the Direct Freight user to look up. Requires an api-token with
        view_all_end_user_authentications access. Ignored if
      in: query
      name: email
      required: false
      type: string
  responses:
    '200':
      description: successful operation
      examples:
        application/json: '{status: "Subscribed", nami_label: "default"}'
      schema:
        properties:
          abilities:
            items:
              type: string
            type: array
          id:
            description: Direct Freight user id.
            type: integer
          message_123:
            description: >-
              Only present when the user has a 123Loadboard plan that affects
              their Direct Freight membership.
            type: string
          nami_label:
            description: used internally for in app purchase paywall campaigns
            type: string
          roles:
            items:
              type: string
            type: array
          status:
            description: Will return the logged in user's status.  (deprecated)
            enum:
              - subscribed
              - posting
              - overdue
              - not_logged_in
            type: string
          username:
            type: string
        type: object
    '404':
      description: >-
        No user found for the provided user_id or email (only when using the
        lookup parameters).
      examples:
        application/json: '{error: "No user found for the provided id."}'
  summary: Get authentication level.
  tags:
    - end_user_authentications
post:
  description: 'This function sends login credentials, and retrieves a stateless token.'
  parameters:
    - in: body
      name: body
      required: true
      schema:
        $ref: '#/definitions/login_credentials'
  responses:
    '201':
      description: successful operation
      schema:
        $ref: '#/definitions/end-user-token'
    '422':
      $ref: '#/responses/error_422'
  summary: Login
  tags:
    - end_user_authentications
x-restlet:
  section: END_USER_AUTHENTICATIONS
