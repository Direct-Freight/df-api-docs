delete:
  description: >
    Logs out the session for the given `end-user-token`. The account is not
    affected.

    The token stops working; call `POST /end_user_authentications` to log in
    again.

    To permanently delete the account, use `DELETE /users`.
  parameters:
    - in: header
      name: end-user-token
      required: true
      type: string
  responses:
    '204':
      description: Logged out. No content is returned.
  summary: Logout
  tags:
    - end_user_authentications
get:
  description: Get current authentication level for the user.
  parameters:
    - in: header
      name: end-user-token
      required: false
      type: string
  responses:
    '200':
      description: successful operation
      examples:
        application/json: '{status: "Subscribed", nami_label: "default"}'
      schema:
        properties:
          abilities:
            items:
              type: string
            type: array
          nami_label:
            description: used internally for in app purchase paywall campaigns
            type: string
          roles:
            items:
              type: string
            type: array
          status:
            description: Will return the logged in user's status.  (deprecated)
            enum:
              - subscribed
              - posting
              - overdue
              - not_logged_in
            type: string
        type: object
  summary: Get authentication level.
  tags:
    - end_user_authentications
post:
  description: 'This function sends login credentials, and retrieves a stateless token.'
  parameters:
    - in: body
      name: body
      required: true
      schema:
        $ref: '#/definitions/login_credentials'
  responses:
    '201':
      description: successful operation
      schema:
        $ref: '#/definitions/end-user-token'
    '422':
      $ref: '#/responses/error_422'
  summary: Login
  tags:
    - end_user_authentications
x-restlet:
  section: END_USER_AUTHENTICATIONS
